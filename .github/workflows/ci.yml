name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DuonDevKit.slnx

      - name: Build
        run: dotnet build DuonDevKit.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DuonDevKit.slnx --no-build --configuration Release
